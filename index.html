<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Genogram Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="bar">
  <div class="brand">
    <svg viewBox="0 0 28 20" width="28" height="20" aria-hidden="true"><rect x="1" y="1" width="8" height="8" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="23" cy="5" r="4" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M5 9v4h18V9M14 13v6" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
    <input id="docTitle" class="doc-title" aria-label="Genogram title" spellcheck="false">
  </div>
  <div class="tools">
    <button id="btnAddPerson" title="Add an unconnected person (A)">+ Person</button>
    <span class="link-group">
      <select id="linkSpec" aria-label="Link type" title="What the Link button draws"></select>
      <button id="btnLink" aria-pressed="false" title="Click, then pick the first and second person (L)">Link</button>
    </span>
    <button id="btnTypes" title="Background, conditions and line types">Key &amp; types</button>
    <span class="sep"></span>
    <button id="btnUndo" title="Undo (Ctrl+Z)">Undo</button>
    <button id="btnRedo" title="Redo (Ctrl+Shift+Z)">Redo</button>
    <button id="btnFit" title="Fit diagram to screen (0)">Fit</button>
    <span class="sep"></span>
    <button id="btnNew">New</button>
    <button id="btnSample">Sample</button>
    <button id="btnOpen" title="Open a saved .genogram.json file">Open…</button>
    <button id="btnSave" title="Save as .genogram.json">Save</button>
    <input id="fileInput" type="file" accept=".json,application/json" hidden>
    <span class="sep"></span>
    <button id="btnSvg">SVG</button>
    <button id="btnPdf" class="primary" title="Choose what goes in the PDF">Export PDF…</button>
  </div>
</header>

<main class="work">
  <section class="stage" id="stage">
    <svg id="canvas" xmlns="http://www.w3.org/2000/svg">
      <defs></defs>
      <rect id="bg" width="100%" height="100%" fill="none"/>
      <g id="world"></g>
    </svg>
    <div id="modeBanner" class="mode-banner" hidden></div>
    <div class="zoom">
      <button id="btnZoomOut" aria-label="Zoom out">−</button>
      <span id="zoomLabel">100%</span>
      <button id="btnZoomIn" aria-label="Zoom in">+</button>
    </div>
  </section>

  <aside class="panel" id="panel"></aside>
</main>

<div id="exportDlg" class="dlg-back" hidden></div>
<div id="toast" class="toast" hidden></div>
<div id="exportHost" aria-hidden="true"></div>

<script src="vendor/jspdf.umd.min.js"></script>
<script src="vendor/svg2pdf.umd.min.js"></script>
<script src="app.js"></script>
</body>
</html>
